<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/admin/dashboard">Admin Panel</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                               <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/admin/user">Category Manager</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/order">Order Manager</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/product">Product Manager</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/category">Category Manager</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/admin/statistics">Statistics</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Order Management</h2>
       <div class="card-body">
            <div th:switch="${orders}">
                <div class="col-md-10 mx-auto">
                    <h4 th:case="null" class="text-center text-danger">No order yet!</h4>
                    <div th:case="*">
                        <div th:each="order : ${orders}" class="mb-4 p-3 border rounded shadow-sm bg-light">
                            <h5 class="text-primary">Order ID: <span th:text="${order.id}"></span></h5>
                            <p class="text-dark"><strong>User ID:</strong> <span th:text="${order.user.userID}"></span></p>
                            <p class="text-dark"><strong>User Name:</strong> <span th:text="${order.user.userName}"></span></p>
                            
                            <p class="text-dark"><strong>Date:</strong> <span th:text="${order.orderDate}"></span></p>
                            <p class="text-dark"><strong>Total Price:</strong> <span th:text="${order.totalAmount}"></span> $</p>

                            <h6 class="mt-3  text-dark">Order Items</h6>
                            <table class="table table-bordered table-striped">
                                <thead class="table-dark">
                                    <tr>
                                        <th class="text-white">Product Name</th>
                                        <th class="text-white">Quantity</th>
                                        <th class="text-white">Price</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${order.orderItems}">
                                        <td class="text-dark" th:text="${item.product.productName}"></td>
                                        <td class="text-dark" th:text="${item.quantity}"></td>
                                        <td class="text-dark" th:text="${item.price}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>  
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
